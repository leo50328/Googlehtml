<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 雲端執行器</title>
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>

    <style>
        :root {
            --bg-color: #1e1e1e;
            --sidebar-bg: #252526;
            --tab-bg: #2d2d2d;
            --border-color: #333;
            --accent-color: #4285F4;
            --line-num-color: #858585;
            --font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            --line-height: 22px;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: #ccc;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 防止最外層出現捲軸 */
        }

        /* --- 工具列 & 分頁列：防止被壓縮 --- */
        .toolbar {
            background: var(--sidebar-bg);
            padding: 8px 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            height: 40px;
            flex-shrink: 0; /* 強制不縮小 */
            z-index: 10;
        }

        .tabs-bar {
            background: var(--sidebar-bg);
            display: flex;
            gap: 1px;
            padding-top: 5px;
            overflow-x: auto;
            flex-shrink: 0; /* 強制不縮小，防止分頁不見 */
            border-bottom: 1px solid #111;
        }

        .tab {
            padding: 8px 20px;
            background: var(--tab-bg);
            color: #888;
            font-size: 13px;
            cursor: pointer;
            min-width: 100px;
            white-space: nowrap;
            user-select: none;
            text-align: center;
            flex-shrink: 0;
        }
        .tab.active { background: #1e1e1e; color: white; border-top: 2px solid var(--accent-color); }

        /* --- 編輯器佈局 --- */
        .main-editor-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
            position: relative;
        }

        /* 行號欄 */
        .line-numbers {
            width: 50px;
            background: #1e1e1e;
            color: var(--line-num-color);
            font-family: var(--font-family);
            font-size: 14px;
            line-height: var(--line-height);
            padding: 10px 5px;
            text-align: right;
            border-right: 1px solid #333;
            user-select: none;
            overflow: hidden;
            flex-shrink: 0;
        }

        .editor-box {
            position: relative;
            flex-grow: 1;
            overflow: hidden;
        }

        /* 統一文字樣式確保重疊 */
        #editor, #hl-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            margin: 0;
            padding: 10px; /* 必須完全一致 */
            box-sizing: border-box;
            font-family: var(--font-family);
            font-size: 14px;
            line-height: var(--line-height);
            white-space: pre; /* 不自動換行，若需換行請改 pre-wrap */
            overflow: auto;
            border: none;
            outline: none;
        }

        #editor {
            z-index: 2;
            background: transparent;
            color: transparent; /* 隱藏原生文字，只顯示游標 */
            caret-color: white;
            resize: none;
        }

        #hl-layer {
            z-index: 1;
            color: #d4d4d4;
            pointer-events: none; /* 讓滑鼠點擊穿透到 textarea */
        }

        /* 亮高顏色 */
        .hl-tag { color: #569cd6; }
        .hl-attr { color: #9cdcfe; }
        .hl-string { color: #ce9178; }
        .hl-comment { color: #6a9955; font-style: italic; }

        /* 狀態列 */
        .statusbar {
            background: #007acc;
            color: white;
            padding: 3px 10px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }

        /* 其他組件 */
        .switch-container { display: flex; align-items: center; gap: 8px; border-right: 1px solid #444; padding-right: 10px; }
        .switch { position: relative; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; border-radius: 20px; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px; background-color: white; border-radius: 50%; transition: .4s; }
        input:checked + .slider { background-color: var(--accent-color); }
        input:checked + .slider:before { transform: translateX(20px); }

        .icon-btn {
            background: transparent; border: 1px solid transparent; color: #ccc; font-size: 18px; width: 36px; height: 36px;
            border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .icon-btn:hover:not(:disabled) { background: #3c3c3c; color: white; }
        .icon-btn:disabled { opacity: 0.2; cursor: not-allowed; }
        
        .spacer { flex-grow: 1; }
        #user-avatar { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #555; display: none; cursor: pointer; }
        #ctx-menu { position: absolute; display: none; background: #252526; border: 1px solid #454545; z-index: 999; padding: 5px 0; min-width: 140px; }
        .ctx-item { padding: 8px 15px; color: #ccc; cursor: pointer; font-size: 13px; }
        .ctx-item:hover { background: #094771; color: white; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="switch-container" title="切換模式：本機 / 雲端">
            <label class="switch">
                <input type="checkbox" id="cloud-switch" onchange="toggleCloudMode()">
                <span class="slider"></span>
            </label>
            <span id="mode-icon">💻</span>
        </div>

        <button id="btn-import" class="icon-btn" onclick="handleImport()" title="匯入檔案">📂</button>
        <button id="btn-export" class="icon-btn" onclick="handleExport()" title="儲存檔案">💾</button>
        
        <div style="width:1px; height:20px; background:#444; margin:0 5px;"></div>

        <button id="btn-run" class="icon-btn" onclick="executeCode()" title="執行網頁">▶️</button>
        <button class="icon-btn" onclick="searchCode()" title="搜尋內容">🔍</button>
        <button class="icon-btn" onclick="pasteCode()" title="貼上">📋</button>
        <button class="icon-btn" onclick="copyCode()" title="複製">📄</button>
        <button id="btn-clear" class="icon-btn" onclick="clearCode()" title="清空內容">🗑️</button>
        
        <div class="spacer"></div>
        <img id="user-avatar" src="" onclick="logoutGoogle()">
    </div>

    <div class="tabs-bar" id="tabs-bar">
        <div id="tabs-list" style="display:flex;"></div>
        <button class="icon-btn" style="width:30px; height:30px; font-size:16px;" onclick="addNewTab()" title="新增分頁">+</button>
    </div>

    <div class="main-editor-container">
        <div id="line-numbers" class="line-numbers">1</div>
        <div class="editor-box">
            <pre id="hl-layer"></pre>
            <textarea id="editor" spellcheck="false" placeholder="請在此輸入 HTML..."></textarea>
        </div>
    </div>

    <div class="statusbar">
        <span id="status-msg">就緒</span>
        <span id="file-info">index.html</span>
    </div>

    <div id="ctx-menu">
        <div class="ctx-item" onclick="renameTab()">✏️ 重命名</div>
        <div class="ctx-item" onclick="closeTab()">❌ 關閉分頁</div>
    </div>

<script>
    const CLIENT_ID = '990557557612-vd1h80orjn7676d28v9ss1v1fope1vgi.apps.googleusercontent.com';
    const API_KEY = 'AIzaSyAv3opO-MHMy8AOlQ0iw5y8Wy2zdlenq0Q';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.profile';

    let tokenClient, accessToken = null, pickerLoaded = false;
    let isCloudMode = false;
    let files = [{ name: 'index.html', content: '' }];
    let activeIdx = 0, ctxIdx = -1;

    const editor = document.getElementById('editor');
    const hlLayer = document.getElementById('hl-layer');
    const lineNumBox = document.getElementById('line-numbers');
    const runBtn = document.getElementById('btn-run');
    const clearBtn = document.getElementById('btn-clear');

    /* --- 修復後的核心更新邏輯 --- */
    function updateEditor() {
        const text = editor.value;
        const isEmpty = text.trim().length === 0;

        runBtn.disabled = isEmpty;
        clearBtn.disabled = isEmpty;

        // 更新行號：確保與內容同步
        const lines = text.split('\n').length;
        lineNumBox.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');

        // 更新語法高亮
        let c = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        c = c.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="hl-comment">$1</span>')
             .replace(/("[^"]*")/g, '<span class="hl-string">$1</span>')
             .replace(/(&lt;\/?)(\w+)(.*?)(\/?&gt;)/g, (m,p1,p2,p3,p4) => 
                `<span class="hl-tag">${p1}${p2}</span>${p3.replace(/(\s+)([a-zA-Z0-9-]+)(=)/g, '$1<span class="hl-attr">$2</span>$3')}<span class="hl-tag">${p4}</span>`
             );
        hlLayer.innerHTML = c + (c.endsWith('\n') ? ' ' : '\n'); // 修正最後一行對不齊問題
        
        syncScroll();
    }

    function syncScroll() {
        // 同步三個層級的滾動
        hlLayer.scrollTop = editor.scrollTop;
        hlLayer.scrollLeft = editor.scrollLeft;
        lineNumBox.scrollTop = editor.scrollTop;
    }

    /* --- 分頁與檔案操作 --- */
    function renderTabs() {
        const list = document.getElementById('tabs-list');
        list.innerHTML = '';
        files.forEach((f, i) => {
            const div = document.createElement('div');
            div.className = `tab ${i === activeIdx ? 'active' : ''}`;
            div.textContent = f.name;
            div.onclick = () => switchTab(i);
            div.oncontextmenu = e => { 
                e.preventDefault(); 
                ctxIdx = i; 
                const m = document.getElementById('ctx-menu');
                m.style.display='block'; m.style.left=e.pageX+'px'; m.style.top=e.pageY+'px'; 
            };
            list.appendChild(div);
        });
        document.getElementById('file-info').textContent = files[activeIdx].name;
    }

    function switchTab(i) {
        files[activeIdx].content = editor.value;
        activeIdx = i;
        editor.value = files[activeIdx].content;
        renderTabs();
        updateEditor();
        editor.focus();
    }

    function addNewTab() {
        files.push({ name: 'new.html', content: '' });
        switchTab(files.length - 1);
    }

    function handleImport() { isCloudMode ? openFromDrive() : importLocal(); }
    function importLocal() {
        const input = document.createElement('input'); 
        input.type = 'file';
        input.accept = ".html,.txt,.js,.css";
        input.onchange = e => {
            const f = e.target.files[0];
            const r = new FileReader();
            r.onload = ev => {
                files.push({ name: f.name, content: ev.target.result });
                switchTab(files.length - 1);
            };
            r.readAsText(f);
        };
        input.click();
    }

    /* --- 其他功能維持原樣但確保穩定 --- */
    function executeCode() {
        const w = window.open();
        w.document.write(editor.value);
        w.document.close();
    }

    function searchCode() {
        const query = prompt("搜尋內容：");
        if (query) {
            const idx = editor.value.indexOf(query);
            if (idx !== -1) {
                editor.focus();
                editor.setSelectionRange(idx, idx + query.length);
                const linesBefore = editor.value.substring(0, idx).split('\n').length;
                editor.scrollTop = (linesBefore - 1) * 22;
            } else alert("未找到內容");
        }
    }

    // Google 相關初始化 (略) - 同前版本
    async function initGoogleLib() {
        tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback: '' });
        await new Promise(r => gapi.load('client:picker', r));
        await gapi.client.init({ apiKey: API_KEY, discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'] });
        pickerLoaded = true;
    }

    async function toggleCloudMode() {
        isCloudMode = document.getElementById('cloud-switch').checked;
        if (isCloudMode && !accessToken) {
            tokenClient.callback = async (resp) => { accessToken = resp.access_token; document.body.classList.add('cloud-mode'); };
            tokenClient.requestAccessToken();
        }
        document.getElementById('mode-icon').textContent = isCloudMode ? '☁️' : '💻';
    }

    // 事件綁定
    editor.addEventListener('input', updateEditor);
    editor.addEventListener('scroll', syncScroll);
    editor.addEventListener('keydown', e => {
        if(e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '    '); }
    });

    window.onload = () => { initGoogleLib(); renderTabs(); updateEditor(); };
    document.onclick = () => document.getElementById('ctx-menu').style.display='none';
</script>
</body>
</html>
